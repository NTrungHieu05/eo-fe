name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://localhost:8080
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  # Chỉ khi push lên main: build image và đẩy lên ghcr.io/ntrunghieu05/eo-fe.
  # BACKEND_URL trỏ tới service "be" trong docker-compose.prod.yml trên VPS.
  image:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            BACKEND_URL=http://be:8080
          tags: |
            ghcr.io/ntrunghieu05/eo-fe:latest
            ghcr.io/ntrunghieu05/eo-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SSH vào VPS, kéo image mới và chạy lại (deploy/deploy.sh trong repo eo-be).
  deploy:
    needs: image
    # Bật bằng biến repo DEPLOY_ENABLED=true sau khi VPS đã chạy bootstrap.sh.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    environment: production
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$TARGET" /opt/toeic/eo-be/deploy/deploy.sh
